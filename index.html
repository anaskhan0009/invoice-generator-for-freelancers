<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Invoice Generator for Freelancers — Dinal Studios</title>
<meta name="description" content="Free online invoice generator for freelancers and small businesses. Create professional invoices with tax, discounts and totals — print or save as PDF. No sign-up.">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { margin: 0; background: #f2f4f8; color: #1c2333; }
  header { background: #14213d; color: #fff; padding: 22px 16px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header p { margin: 0; opacity: .85; font-size: 14px; }
  .wrap { max-width: 900px; margin: 24px auto; padding: 0 14px 40px; }
  .card { background: #fff; border-radius: 12px; padding: 22px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px){ .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; font-weight: 600; color: #5a6477; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
  input, textarea, select { width: 100%; padding: 9px 10px; border: 1px solid #ccd3e0; border-radius: 8px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; color: #5a6477; border-bottom: 2px solid #e3e8f2; padding: 8px 6px; }
  td { padding: 6px; border-bottom: 1px solid #eef1f7; }
  td input { border: none; padding: 6px 4px; }
  td input:focus { outline: 1px solid #b9c6e4; border-radius: 6px; }
  .amt { text-align: right; font-weight: 600; white-space: nowrap; }
  .btn { background: #14213d; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn:hover { background: #1f3560; }
  .btn.light { background: #e8edf7; color: #14213d; }
  .btn.danger { background: #fdeaea; color: #b3261e; padding: 6px 10px; }
  .totals { margin-left: auto; width: 280px; margin-top: 16px; }
  .totals .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .totals .row.grand { border-top: 2px solid #14213d; font-size: 17px; font-weight: 700; margin-top: 6px; padding-top: 10px; }
  .totals input { width: 70px; text-align: right; padding: 4px 6px; }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  footer { text-align: center; color: #8a93a6; font-size: 12px; padding: 18px; }
  @media print {
    header, .actions, .no-print, footer { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; }
    td input, .totals input { border: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Invoice Generator</h1>
  <p>Free professional invoices for freelancers &amp; small businesses — no sign-up, works offline</p>
</header>
<div class="wrap">
  <div class="card" id="invoice">
    <div class="grid">
      <div>
        <label>Your Business / Name</label>
        <input id="bizName" value="Dinal Studios">
        <label>Your Email</label>
        <input id="bizEmail" placeholder="you@example.com">
        <label>Bill To (Client Name)</label>
        <input id="clientName" placeholder="Client name">
        <label>Client Email</label>
        <input id="clientEmail" placeholder="client@example.com">
      </div>
      <div>
        <label>Invoice #</label>
        <input id="invNo" value="INV-001">
        <label>Invoice Date</label>
        <input id="invDate" type="date">
        <label>Due Date</label>
        <input id="dueDate" type="date">
        <label>Currency</label>
        <select id="currency">
          <option value="$">USD ($)</option>
          <option value="Rs ">PKR (Rs)</option>
          <option value="€">EUR (€)</option>
          <option value="£">GBP (£)</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr><th style="width:46%">Description</th><th>Qty</th><th>Rate</th><th class="amt">Amount</th><th class="no-print"></th></tr>
      </thead>
      <tbody id="items"></tbody>
    </table>
    <div class="actions no-print" style="margin-top:12px">
      <button class="btn light" onclick="addItem()">+ Add Item</button>
    </div>

    <div class="totals">
      <div class="row"><span>Subtotal</span><span id="subTotal">0.00</span></div>
      <div class="row"><span>Tax %</span><input id="taxRate" type="number" value="0" min="0" oninput="calc()"></div>
      <div class="row"><span>Discount</span><input id="discount" type="number" value="0" min="0" oninput="calc()"></div>
      <div class="row grand"><span>Total Due</span><span id="grandTotal">0.00</span></div>
    </div>

    <label>Notes / Payment Details</label>
    <textarea id="notes" rows="3" placeholder="Payment method, thank-you note...">Thank you for your business!</textarea>

    <div class="actions no-print">
      <button class="btn" onclick="window.print()">Print / Save as PDF</button>
      <button class="btn light" onclick="resetAll()">New Invoice</button>
    </div>
  </div>
  <footer>Built by Dinal Studios — free invoice maker, online billing tool, freelancer invoice template</footer>
</div>
<script>
  const itemsEl = document.getElementById('items');
  const fmt = n => n.toFixed(2);
  function cur(){ return document.getElementById('currency').value; }
  function addItem(desc='', qty=1, rate=0){
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><input class="d" value="'+desc.replace(/"/g,'&quot;')+'" placeholder="Service or product"></td>' +
      '<td><input class="q" type="number" min="0" value="'+qty+'" oninput="calc()"></td>' +
      '<td><input class="r" type="number" min="0" step="0.01" value="'+rate+'" oninput="calc()"></td>' +
      '<td class="amt a">0.00</td>' +
      '<td class="no-print"><button class="btn danger" onclick="this.parentElement.parentElement.remove();calc()">✕</button></td>';
    itemsEl.appendChild(tr); calc();
  }
  function calc(){
    let sub = 0;
    itemsEl.querySelectorAll('tr').forEach(tr => {
      const q = parseFloat(tr.querySelector('.q').value) || 0;
      const r = parseFloat(tr.querySelector('.r').value) || 0;
      const a = q * r; sub += a;
      tr.querySelector('.a').textContent = cur() + fmt(a);
    });
    const tax = sub * (parseFloat(document.getElementById('taxRate').value) || 0) / 100;
    const disc = parseFloat(document.getElementById('discount').value) || 0;
    document.getElementById('subTotal').textContent = cur() + fmt(sub);
    document.getElementById('grandTotal').textContent = cur() + fmt(Math.max(0, sub + tax - disc));
  }
  function resetAll(){
    itemsEl.innerHTML = '';
    addItem('Video editing service', 1, 50);
    document.getElementById('clientName').value = '';
    document.getElementById('clientEmail').value = '';
    calc();
  }
  document.getElementById('currency').addEventListener('change', calc);
  const today = new Date(); const iso = today.toISOString().slice(0,10);
  document.getElementById('invDate').value = iso;
  const due = new Date(Date.now() + 7*864e5); document.getElementById('dueDate').value = due.toISOString().slice(0,10);
  addItem('Video editing service', 1, 50);
  addItem('Thumbnail design', 2, 15);
</script>
</body>
</html>
